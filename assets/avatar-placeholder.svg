<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef0fb" />
      <stop offset="50%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#f8f9ff" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg-grad)" />

  <!-- Outer Glow Ring -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#accent-grad)" stroke-width="4" filter="url(#glow)" opacity="0.7" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#accent-grad)" stroke-width="2" />

  <!-- Abstract Tech Grid Lines -->
  <line x1="70" y1="180" x2="330" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  <line x1="200" y1="50" x2="200" y2="310" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Silhouette Avatar -->
  <!-- Head -->
  <circle cx="200" cy="140" r="50" fill="#e0e7ff" stroke="url(#accent-grad)" stroke-width="3" />
  
  <!-- Modern Geometric Body / Shoulders -->
  <path d="M 120 270 C 120 215, 155 198, 200 198 C 245 198, 280 215, 280 270 Z" fill="#e0e7ff" stroke="url(#accent-grad)" stroke-width="3" />

  <!-- Inner Initials Badge: SI -->
  <text x="200" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="url(#accent-grad)">SI</text>

  <!-- Code Tag Elements -->
  <text x="95" y="145" font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="#38bdf8" opacity="0.7">&lt;</text>
  <text x="305" y="145" font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="#c084fc" opacity="0.7">/&gt;</text>

  <!-- Bottom Helper Caption -->
  <rect x="70" y="325" width="260" height="42" rx="21" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
  <circle cx="95" cy="346" r="5" fill="#10b981" />
  <text x="112" y="351" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#1e293b">Add your photo: assets/profile.jpg</text>
</svg>

